services:
  localstack:
    image: localstack/localstack:4.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns,dynamodb
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    environment:
      MODEL_MODE: stub
      MODEL_VERSION: local-stub-v1
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: local
      LOCAL_DATA_DIR: /data
      LABELS_PATH: /workspace/labels.txt
      INFERENCE_MODE: http
      INFERENCE_URL: http://inference:8080
      LOCAL_JWT_SECRET: docker-local-only-secret
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    depends_on:
      inference:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  localstack-data:
  api-data:
