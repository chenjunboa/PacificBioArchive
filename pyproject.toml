[project]
name = "pacific-bioarchive"
version = "0.1.0"
description = "Multi-cloud serverless wildlife media archive prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "google-auth[requests]>=2.35",
  "httpx>=0.27",
  "mangum>=0.19",
  "pillow>=11.0",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["services/api/tests", "services/inference/tests", "services/worker/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
